# QAWork 自动化计划示例。复制到项目根目录改名 qawork.yaml 再改包名。
#
# 执行：qawork run -plan qawork.yaml
# 校验：qawork run -plan qawork.yaml -validate
# 兼容：qawork compat -plan qawork.yaml -apk app.apk
version: 1

defaults:
  # 留空则自动取第一台在线设备；CI 建议写死序列号。
  serial: ""
  interval: 1s
  warmup: 1s
  settle: 1s
  assert:
    min_fps: 48
    max_jank: 5
    max_cpu: 70
    max_mem: 1024
    max_temp_c: 45
    max_frame_p95_ms: 33
    max_startup_ms: 5000

cases:
  - name: settings-scroll
    # 演示用的系统设置；换成自己的游戏包名。
    package: com.android.settings
    steps:
      - action: launch
        cold: true
      - action: wait
        seconds: 1
      - action: swipe
        x: 500
        y: 1500
        x2: 500
        y2: 300
        duration_ms: 400
      - action: wait
        seconds: 1
      - action: swipe
        x: 500
        y: 1500
        x2: 500
        y2: 300
        duration_ms: 400
      - action: wait
        seconds: 1
      - action: screenshot
    # 系统设置不是游戏，演示阈值放宽；游戏请用 defaults 或自己的值。
    assert:
      min_fps: 20
      max_frame_p95_ms: 50
      max_startup_ms: 5000
