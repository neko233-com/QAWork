name: CI & Release (Windows x64)

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -count=1 ./...
      - name: Build CLI and GUI
        run: |
          go build -trimpath -o dist/qawork.exe ./cmd/qawork
          go build -trimpath -o dist/qawork-gui.exe ./cmd/qawork-gui
      - name: Smoke test CLI
        run: .\dist\qawork.exe version
      - uses: actions/upload-artifact@v4
        with:
          name: qawork-windows-amd64
          path: dist/*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: qawork-windows-amd64
          path: dist
      - name: Package
        run: Compress-Archive -Path dist\*.exe -DestinationPath dist\QAWork-windows-amd64.zip -Force
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist\QAWork-windows-amd64.zip --repo "${{ github.repository }}" --title "QAWork ${{ github.ref_name }}" --generate-notes
