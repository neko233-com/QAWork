name: CI & Release (Windows x64 + macOS arm64 cross)

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache: true
      - name: Assert CGO disabled
        shell: bash
        run: |
          cgo="$(go env CGO_ENABLED)"
          if [ "$cgo" != "0" ]; then echo "CGO_ENABLED must be 0, got $cgo"; exit 1; fi
      - name: Assert gofmt clean
        shell: bash
        run: |
          files="$(gofmt -l $(git ls-files '*.go'))"
          if [ -n "$files" ]; then echo "gofmt needed:"; echo "$files"; exit 1; fi
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -count=1 ./...
      - name: Build Windows CLI and GUI
        shell: bash
        run: |
          mkdir -p dist/qawork-windows-amd64
          go build -trimpath -o dist/qawork-windows-amd64/qawork.exe ./cmd/qawork
          go build -trimpath -o dist/qawork-windows-amd64/qawork-gui.exe ./cmd/qawork-gui
      - name: Cross-build macOS arm64
        shell: bash
        run: |
          mkdir -p dist/qawork-macos-arm64
          GOOS=darwin GOARCH=arm64 go build -trimpath -o dist/qawork-macos-arm64/qawork ./cmd/qawork
          GOOS=darwin GOARCH=arm64 go build -trimpath -o dist/qawork-macos-arm64/qawork-gui ./cmd/qawork-gui
          go version -m dist/qawork-macos-arm64/qawork | head -3
      - name: Smoke test CLI
        shell: bash
        run: ./dist/qawork-windows-amd64/qawork.exe version
      - name: Validate example plan
        shell: bash
        run: ./dist/qawork-windows-amd64/qawork.exe run -plan examples/qawork.yaml -validate
      - name: Smoke test MCP
        shell: bash
        run: |
          out="$(echo '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' | ./dist/qawork-windows-amd64/qawork.exe mcp 2>/dev/null)"
          echo "$out" | grep -q '"qawork_perf"'
          echo "$out" | grep -q '"qawork_doctor"'
          echo "$out" | grep -q '"qawork_validate_plan"'
          echo "$out" | grep -q '"qawork_compat_matrix"'
      - uses: actions/upload-artifact@v4
        with:
          name: qawork-windows-amd64
          path: dist/qawork-windows-amd64/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: qawork-macos-arm64
          path: dist/qawork-macos-arm64/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: qawork-*
          path: dist
      - name: Package
        run: |
          mkdir -p release
          chmod +x dist/qawork-macos-arm64/qawork dist/qawork-macos-arm64/qawork-gui
          tar -czf release/QAWork-macos-arm64.tar.gz -C dist/qawork-macos-arm64 .
          (cd dist/qawork-windows-amd64 && zip -r ../../release/QAWork-windows-amd64.zip .)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" release/QAWork-windows-amd64.zip release/QAWork-macos-arm64.tar.gz --repo "${{ github.repository }}" --title "QAWork ${{ github.ref_name }}" --generate-notes
